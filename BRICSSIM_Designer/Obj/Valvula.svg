<svg xmlns="http://www.w3.org/2000/svg" width="120" height="160" viewBox="0 0 120 160">
  <!-- Cúpula superior -->
  <path d="M20,40 A40,30 0 0,1 100,40" fill="none" stroke="#000000" stroke-width="2" id="cupula"></path>

  <!-- Base da cúpula -->
  <line x1="20" y1="40" x2="100" y2="40" stroke="#000000" stroke-width="2"></line>

  <!-- Hastes verticais -->
  <line x1="35" y1="40" x2="35" y2="90" stroke="#000000" stroke-width="2"></line>
  <line x1="60" y1="40" x2="60" y2="90" stroke="#000000" stroke-width="2"></line>
  <line x1="85" y1="40" x2="85" y2="90" stroke="#000000" stroke-width="2"></line>

  <!-- Corpo da válvula -->
  <path d="M30,90
           C 40,100 80,100 90,90
           L 90,130
           C 80,120 40,120 30,130 Z" fill="#ffcccc" stroke="#000000" stroke-width="2" id="corpo"></path>

  <!-- Flanges planos -->
  <rect x="20" y="85" width="10" height="40" fill="#ffcccc" stroke="#000000" stroke-width="2"></rect>
  <rect x="90" y="85" width="10" height="40" fill="#ffcccc" stroke="#000000" stroke-width="2"></rect>
</svg>
