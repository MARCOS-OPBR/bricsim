repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: debug-statements

  - repo: https://github.com/psf/black
    rev: 24.4.2
    hooks:
      - id: black
        additional_dependencies: ["click<9"]
        args: ["--safe"]

  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort

  # Flake8 crítico (só erros sérios)
  - repo: https://github.com/pycqa/flake8
    rev: 7.1.1
    hooks:
      - id: flake8
        name: flake8 (critical)
        args: ["--select=E9,F63,F7,F82"]
        additional_dependencies: []

  # Flake8 completo (manual)
  - repo: https://github.com/pycqa/flake8
    rev: 7.1.1
    hooks:
      - id: flake8
        name: flake8 (full)
        stages: [manual]
        additional_dependencies: []

# NÃO tocar nessas árvores nesta fase (incluí as legadas):
exclude: |
  ^(design/ui/|simulator/ui/|design/objects/|simulator/objects/|BRICSIM_Simulator/|BRICSSIM_Designer/)|
  ^build/|^dist/|^.venv/|^venv/|^\.git/|__pycache__
