[tool.black]
line-length = 88
target-version = ["py311"]
exclude = '^(design/ui/|simulator/ui/|design/objects/|simulator/objects/|build/|dist/|\.venv/|venv/|\.git/|__pycache__)'

[tool.isort]
profile = "black"
line_length = 88
include_trailing_comma = true
known_first_party = ["design","simulator"]
skip_glob = [
  "design/ui/**",
  "simulator/ui/**",
  "design/objects/**",
  "simulator/objects/**",
  "build/**",
  "dist/**",
  ".venv/**",
  "venv/**"
]
